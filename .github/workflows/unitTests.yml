name: Unit Tests

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run test suite via unittest
        run: python -m unittest discover -s tests -v

      - name: Fail if the add-on's own tests were not collected
        run: |
          python - <<'PY'
          import unittest
          names = {t.id().split(".")[0]
                   for s in unittest.defaultTestLoader.discover("tests")._tests
                   for t in unittest.TestSuite(s)._tests for t in getattr(t, "_tests", [t])}
          missing = {"test_sonos_emulator", "test_sonos_backend"} - names
          assert not missing, f"test modules missing from the run: {missing}"
          print(f"collected {len(names)} test modules")
          PY
